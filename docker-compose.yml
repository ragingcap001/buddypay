services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: buddypay
      POSTGRES_PASSWORD: buddypay
      POSTGRES_DB: buddypay
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buddypay -d buddypay"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      ASE_SEED: ${ASE_SEED:-0}
    volumes:
      - .:/var/www/html
    ports:
      - "9000:9000"

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - app
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/app.conf:/etc/nginx/conf.d/default.conf:ro

  # Horizon queue workers (critical financial events, outbox, notifications).
  worker:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Migrations first (idempotent) — the worker may start before the app
    # container has run them, and `horizon` needs the jobs tables.
    command: sh -c "php artisan migrate --force && php artisan horizon"
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
    volumes:
      - .:/var/www/html

volumes:
  pgdata:
  redisdata:

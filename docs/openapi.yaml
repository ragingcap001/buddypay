openapi: 3.0.3
info:
  title: Aṣẹ Financial Platform API
  version: 1.0.0
  description: |
    Nigerian digital financial services platform — wallet, double-entry
    ledger, bill payments, KYC.

    Conventions:
    - All amounts are integer minor units (kobo for NGN).
    - Every response carries a `request_id`; errors use the shape
      `{ success: false, error: { code, message }, request_id }`.
    - Financial mutation endpoints (`POST /wallet/fund`, `POST /bills/pay`)
      require a unique `Idempotency-Key` header and the transaction PIN
      (`X-Transaction-Pin` header).
    - Authentication uses Bearer tokens (Sanctum).
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: health
  - name: auth
  - name: wallet
  - name: transactions
  - name: bills
  - name: kyc
  - name: webhooks
paths:
  /health:
    get:
      tags: [health]
      summary: Platform health (healthy | degraded | unhealthy)
      security: []
      responses:
        "200": { description: Healthy or degraded }
        "503": { description: Unhealthy (database unreachable) }
  /auth/register:
    post:
      tags: [auth]
      security: []
      summary: Register (issues a registration OTP)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, phone, password, password_confirmation]
              properties:
                name: { type: string, maxLength: 100 }
                phone: { type: string, pattern: "^(\+234|0)[789][01]\d{8}$" }
                password: { type: string, minLength: 8 }
                password_confirmation: { type: string }
      responses:
        "201": { description: "Registered; OTP issued (data.dev_otp in local/testing)" }
        "409": { description: USER_EXISTS }
  /auth/verify-otp:
    post:
      tags: [auth]
      security: []
      summary: Verify registration OTP and sign in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, otp]
              properties:
                phone: { type: string }
                otp: { type: string, pattern: "^\d{6}$" }
      responses:
        "200": { description: "Verified; returns user, wallet, token" }
        "401": { description: UNAUTHENTICATED }
        "404": { description: USER_NOT_FOUND | NO_ACTIVE_CHALLENGE }
        "422": { description: OTP_INVALID | OTP_EXPIRED }
        "429": { description: OTP_LOCKED }
  /auth/login:
    post:
      tags: [auth]
      security: []
      summary: Login with phone + password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, password]
              properties:
                phone: { type: string }
                password: { type: string }
      responses:
        "200": { description: "Signed in; returns user, wallet, token" }
        "401": { description: INVALID_CREDENTIALS }
        "403": { description: UNVERIFIED_USER | USER_SUSPENDED }
  /auth/logout:
    post:
      tags: [auth]
      summary: Revoke the current token
      responses:
        "200": { description: Signed out }
  /auth/forgot-password:
    post:
      tags: [auth]
      security: []
      summary: Request a password-reset token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string }
      responses:
        "200": { description: "Constant response (no account enumeration); data.dev_reset_token in local/testing" }
  /auth/reset-password:
    post:
      tags: [auth]
      security: []
      summary: Reset password with a single-use token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password, password_confirmation]
              properties:
                token: { type: string }
                password: { type: string, minLength: 8 }
                password_confirmation: { type: string }
      responses:
        "200": { description: Password updated }
        "422": { description: RESET_TOKEN_INVALID }
  /auth/pin:
    post:
      tags: [auth]
      summary: Set/change the transaction PIN (requires password)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, pin]
              properties:
                password: { type: string }
                pin: { type: string, pattern: "^\d{4}$" }
      responses:
        "200": { description: PIN set }
        "401": { description: INVALID_CREDENTIALS }
  /auth/verify-pin:
    post:
      tags: [auth]
      summary: Verify the transaction PIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pin]
              properties:
                pin: { type: string, pattern: "^\d{4}$" }
      responses:
        "200": { description: "{ valid: boolean }" }
  /wallet:
    get:
      tags: [wallet]
      summary: Wallet dashboard summary (balances + KYC tier + limits)
      responses:
        "200": { description: Wallet summary }
  /wallet/balance:
    get:
      tags: [wallet]
      summary: Wallet balances in kobo (control, reserved, available)
      responses:
        "200": { description: Wallet balances }
  /wallet/transactions:
    get:
      tags: [wallet]
      summary: Recent wallet transactions
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 100 }
      responses:
        "200": { description: Transaction list }
  /wallet/fund:
    post:
      tags: [wallet]
      summary: Fund the wallet via a payment provider (idempotent, PIN required)
      description: |
        `provider` selects the funding rail (`mock`, `wema`, `monnify`).
        Asynchronous rails (bank transfer) return a `VERIFYING` transaction
        with `data.metadata.payment_details` carrying the deposit
        instructions (e.g. the virtual account to transfer to); the wallet is
        credited when the provider confirms (webhook / verify).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/TransactionPin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount: { type: integer, minimum: 100, description: "Kobo" }
                method: { type: string }
                provider: { type: string, enum: [mock, wema, monnify] }
      responses:
        "200": { description: "Transaction (COMPLETED | FAILED | VERIFYING)" }
        "400": { description: IDEMPOTENCY_KEY_REQUIRED | PIN_REQUIRED }
        "401": { description: PIN_INVALID }
        "403": { description: RISK_BLOCKED }
        "409": { description: IDEMPOTENCY_KEY_REUSED | REQUEST_IN_PROGRESS }
  /wallet/payout:
    post:
      tags: [wallet]
      summary: Transfer out of the wallet to a bank account (idempotent, PIN required)
      description: |
        Wallet funds are reserved immediately (amount + fee) and released
        back on a definitive failure; on ambiguity they stay reserved until
        the provider confirms (webhook / verify / stale-transaction sweep).
        `provider` selects the payout rail (`mock`, `wema`, `monnify`).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/TransactionPin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, bank_code, account_number, account_name]
              properties:
                amount: { type: integer, minimum: 100, description: "Kobo" }
                bank_code: { type: string, pattern: "^\\d{3}$", description: "NIP bank code" }
                account_number: { type: string, pattern: "^\\d{10}$" }
                account_name: { type: string, maxLength: 100 }
                narration: { type: string, maxLength: 100 }
                provider: { type: string, enum: [mock, wema, monnify] }
      responses:
        "200": { description: "Transaction (COMPLETED | FAILED | VERIFYING)" }
        "400": { description: IDEMPOTENCY_KEY_REQUIRED | PIN_REQUIRED }
        "401": { description: PIN_INVALID }
        "403": { description: RISK_BLOCKED }
        "409": { description: IDEMPOTENCY_KEY_REUSED | REQUEST_IN_PROGRESS }
        "422": { description: INSUFFICIENT_BALANCE | BENEFICIARY_NOT_FOUND }
  /transactions:
    get:
      tags: [transactions]
      summary: List my transactions
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 100 }
      responses:
        "200": { description: Transaction list }
  /transactions/{reference}:
    get:
      tags: [transactions]
      summary: Transaction details (owner only)
      parameters:
        - $ref: "#/components/parameters/Reference"
      responses:
        "200": { description: Transaction details }
        "404": { description: TRANSACTION_NOT_FOUND }
  /transactions/{reference}/verify:
    post:
      tags: [transactions]
      summary: Verify an AMBIGUOUS/VERIFYING transaction with the original provider (never fails over)
      parameters:
        - $ref: "#/components/parameters/Reference"
      responses:
        "200": { description: Verification result }
        "404": { description: TRANSACTION_NOT_FOUND }
        "409": { description: NOT_VERIFIABLE (already settled) }
  /bills/categories:
    get:
      tags: [bills]
      summary: Bill categories
      responses:
        "200": { description: Categories }
  /bills/providers:
    get:
      tags: [bills]
      summary: Bill providers
      responses:
        "200": { description: Providers }
  /bills/products:
    get:
      tags: [bills]
      summary: Bill products (filter by ?category=)
      parameters:
        - name: category
          in: query
          schema: { type: string, example: AIRTIME }
      responses:
        "200": { description: Products }
  /bills/validate:
    post:
      tags: [bills]
      summary: Validate a customer/product with the provider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, phone]
              properties:
                type: { type: string, enum: [AIRTIME, DATA, ELECTRICITY, CABLE_TV, BETTING, BANK_TRANSFER] }
                phone: { type: string }
      responses:
        "200": { description: "{ valid, customer_name, expected_amount, error }" }
  /bills/pay:
    post:
      tags: [bills]
      summary: Pay a bill from the wallet (idempotent, PIN required, reservation-protected)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/TransactionPin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, amount, phone]
              properties:
                type: { type: string, enum: [AIRTIME, DATA, ELECTRICITY, CABLE_TV, BETTING, BANK_TRANSFER] }
                amount: { type: integer, minimum: 10000, description: "Kobo (bill amount, fee added on top)" }
                phone: { type: string }
      responses:
        "200": { description: "Transaction (COMPLETED | FAILED | VERIFYING)" }
        "400": { description: IDEMPOTENCY_KEY_REQUIRED | PIN_REQUIRED }
        "401": { description: PIN_INVALID }
        "403": { description: RISK_BLOCKED }
        "409": { description: IDEMPOTENCY_KEY_REUSED | REQUEST_IN_PROGRESS }
        "422": { description: INSUFFICIENT_BALANCE }
  /kyc:
    get:
      tags: [kyc]
      summary: KYC profile (status, tier, limits)
      responses:
        "200": { description: KYC profile }
  /kyc/bvn:
    post:
      tags: [kyc]
      summary: Submit BVN verification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bvn]
              properties:
                bvn: { type: string, pattern: "^\d{11}$" }
      responses:
        "200": { description: KYC profile after verification }
  /kyc/nin:
    post:
      tags: [kyc]
      summary: Submit NIN verification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nin]
              properties:
                nin: { type: string, pattern: "^\d{11}$" }
      responses:
        "200": { description: KYC profile after verification }
  /kyc/documents:
    post:
      tags: [kyc]
      summary: Upload a KYC document (multipart)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [document]
              properties:
                document: { type: string, format: binary }
                type: { type: string, example: IDENTITY_FRONT }
      responses:
        "201": { description: Document stored (status PENDING) }
  /webhooks/{provider}:
    post:
      tags: [webhooks]
      security: []
      summary: Provider webhook receiver (HMAC-signed, idempotent)
      description: |
        Signature schemes: `mock`/`wema` — HMAC-SHA256 of the raw body in
        `X-Webhook-Signature` keyed by the provider webhook secret;
        `monnify` — HMAC-SHA512 of the raw body in `monnify-signature` keyed
        by the Monnify client secret (production only). Raw event shapes are
        normalized per provider; events settle `WALLET_FUNDING` (deposits)
        and `BANK_TRANSFER` (payouts) transactions idempotently.
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Processed (or duplicate) }
        "401": { description: WEBHOOK_SIGNATURE_INVALID }
        "404": { description: PROVIDER_NOT_FOUND }
        "500": { description: WEBHOOK_PROCESSING_FAILED }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Unique client-generated key (1-128 chars). Retries with the same key return the original result.
      schema: { type: string, minLength: 1, maxLength: 128 }
    TransactionPin:
      name: X-Transaction-Pin
      in: header
      required: true
      description: The user's 4-digit transaction PIN.
      schema: { type: string, pattern: "^\d{4}$" }
    Reference:
      name: reference
      in: path
      required: true
      description: Transaction reference (e.g. ASE_T_01J...)
      schema: { type: string }
